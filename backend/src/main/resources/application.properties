spring.application.name=mealgram
spring.profiles.default=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/mealgram
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET:}

# 식단 추천 호출 제한
rate-limit.meals.max-requests=5
rate-limit.meals.guest-max-requests=3
rate-limit.meals.window-seconds=60

# 프론트 주소
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# 메일 발송

# OpenAI 키는 환경변수로 전달
openai.api-key=${OPENAI_API_KEY:}
openai.chat-model=gpt-4o-mini
openai.chat-url=https://api.openai.com/v1/chat/completions

# 목록 조회 설정
spring.data.web.pageable.max-page-size=100
spring.jpa.open-in-view=false

# 헬스 체크
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
